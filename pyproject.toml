# Choose one torch extra: cpu, cu128 or rocm; all torch packages must use the same index.
# Windows AMD iGPUs use the separate requirements.txt installation.

[project]
name = "artnet-lightshow-analysis"
version = "1.0.0"
description = "Audio analysis and live input for the Art-Net lightshow."
requires-python = ">=3.10,<3.14"
dependencies = [
    # Core analysis.
    "librosa>=0.10",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "soundfile>=0.12",
    "threadpoolctl>=3.1",
    "audioread>=3.0",
    # Models. torch itself is in the extras below, one per build.
    "huggingface_hub>=0.23",
    "beat_this>=1.1",
    "demucs>=4.0",
    "muq>=0.1",
    # MuQ calls the Conformer encoder directly and needs its v4 hidden states.
    "transformers==4.51.3",
    "safetensors>=0.4",
    # SongFormer's code, which ships with its weights (src/analysis/songformer.py).
    "einops>=0.7",
    "x-transformers>=1.0",
    "ema-pytorch>=0.2",
    "loguru>=0.7",
    "omegaconf>=2.3",
    # The slower separator. Its CPU extra is only onnxruntime; PyTorch still
    # runs it on the GPU.
    "audio-separator[cpu]>=0.30",
    "onnxruntime>=1.17",
    # The AudioSet tagger (weights: scripts/download-models.py --only panns).
    "panns_inference>=0.1.1",
    # Key detection (Deezer's S-KEY), weights included. Its own metadata pins
    # torch 2.7 exactly; see dependency-metadata below for why that is ignored.
    "skey @ git+https://github.com/deezer/skey.git@918b83d273568d5041569bb8068843d19a335726",
    # Live input.
    "soundcard>=0.4.6",
    "sounddevice>=0.5",
    # Include the Deno runtime needed by yt-dlp.
    "yt-dlp[default,deno]>=2025.11.12",
    # ffmpeg fallback when none is on PATH.
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
cpu = ["torch>=2.6", "torchaudio>=2.6", "torchvision>=0.21"]
cu128 = ["torch>=2.7", "torchaudio>=2.7", "torchvision>=0.22"]
rocm = ["torch>=2.7", "torchaudio>=2.7", "torchvision>=0.22", "triton-rocm; sys_platform == 'linux'"]

[tool.uv]
package = false
conflicts = [[{ extra = "cpu" }, { extra = "cu128" }, { extra = "rocm" }]]

# Override S-KEY metadata pins to keep the selected GPU torch build; its code supports the locked version.
[[tool.uv.dependency-metadata]]
name = "skey"
version = "0.1.0"
requires-dist = ["numpy", "torch", "torchaudio", "tqdm", "einops>=0.8", "nnAudio>=0.3.3", "soundfile"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-rocm", extra = "rocm", marker = "sys_platform == 'linux'" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-rocm", extra = "rocm", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-rocm", extra = "rocm", marker = "sys_platform == 'linux'" },
]
# ROCm's torch needs its own build of Triton, published only beside it.
triton-rocm = [
    { index = "pytorch-rocm", extra = "rocm", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true
